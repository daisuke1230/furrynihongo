 });
 grammars.forEach(g=>{if(Array.isArray(g?.exampleIds)&&g.exampleIds.some(id=>!refIds.has(id)))errors.push('文法 '+String(g.id)+' 有不存在的例句 ID。');});

}
function cleanSettings(raw={}){return {theme:['light','dark','system'].includes(raw.theme)?raw.theme:'light',fontSize:[.9,1,1.15,1.3].includes(raw.fontSize)?raw.fontSize:1,hira:raw.hira!==false,zh:raw.zh!==false,en:raw.en===true,rate:[.75,1,1.25].includes(raw.rate)?raw.rate:1,voiceURI:typeof raw.voiceURI==='string'?raw.voiceURI.slice(0,500):''};}
function cleanUser(raw={}){return {favorites:[...new Set((Array.isArray(raw.favorites)?raw.favorites:[]).filter(idValid))].slice(0,10000),recent:(Array.isArray(raw.recent)?raw.recent:[]).filter(r=>plain(r)&&idValid(r.id)&&Number.isFinite(r.at)).slice(0,50),records:(Array.isArray(raw.records)?raw.records:[]).filter(r=>plain(r)&&idValid(r.id)&&Number.isFinite(r.at)&&Number.isInteger(r.total)&&r.total>=1&&r.total<=8&&Number.isInteger(r.mistakes)&&r.mistakes>=0&&Array.isArray(r.wrongIds)&&r.wrongIds.every(idValid)&&Array.isArray(r.phraseIds)&&r.phraseIds.every(idValid)).slice(0,100),settings:cleanSettings(raw.settings)};}
function parseImport(raw,current,base){

 if(raw.schemaVersion!==SCHEMA||!plain(raw.custom)||!Array.isArray(raw.overrides)||!plain(raw.user))return {errors:['備份格式不完整或版本不支援。'],warnings:[]};

 if(raw.custom.phrases.some(p=>base.phrases.some(b=>b.id===p.id)))v.errors.push('自訂句子 ID 不可使用內建 ID。');

function mergeImport(state,parsed,base,replace){

const api={SCHEMA,norm,key,defaults,allData,search,shuffle,sample,duplicates,validateBundle,cleanSettings,cleanUser,parseImport,mergeImport};

<script>
'use strict';
(()=>{

function phraseText(p){return `<p class="jp" lang="ja">${esc(p.texts['ja-JP'])}</p>${state.settings.hira?`<p class="hira" lang="ja">${esc(p.readings['ja-Hira'])}</p>`:''}${state.settings.zh?`<p class="translation" lang="zh-Hant">${esc(p.texts['zh-TW'])}</p>`:''}${state.settings.en&&p.texts['en-US']?`<p class="translation" lang="en">${esc(p.texts['en-US'])}</p>`:''}${state.settings.zh&&p.usageNote?`<p class="usage-note"><strong>用法：</strong>${esc(p.usageNote)}</p>`:''}`;}

function filterHTML(){return `<section class="filter-area" aria-label="教材篩選"><label class="searchbox"><span class="hidden">搜尋教材</span><input id="search" type="search" value="${esc(filters.q)}" placeholder="搜尋中文、日文、讀音或標籤…" autocomplete="off"></label><div class="chips kind-tabs" role="group" aria-label="教材種類">${[['','句子＋單字'],['phrase','會話句'],['word','單字']].map(([v,t])=>`<button class="chip ${filters.kind===v?'active':''}" data-kind="${v}" aria-pressed="${filters.kind===v}">${t}</button>`).join('')}</div><div class="chips" role="group" aria-label="使用範圍">${[['all','全部'],['common','常用'],['favorites','我的收藏'],['recent','最近使用']].map(([v,t])=>`<button class="chip ${filters.scope===v?'active':''}" data-scope="${v}" aria-pressed="${filters.scope===v}">${t}</button>`).join('')}</div><div class="filter-grid"><label>情境<select id="filterCategory">${opt('','全部情境',filters.category)}${data.categories.map(c=>opt(c.id,c.name,filters.category)).join('')}</select></label><label>文法<select id="filterGrammar">${opt('','全部文法',filters.grammar)}${data.grammars.map(g=>opt(g.id,g.title,filters.grammar)).join('')}</select></label><label>難度<select id="filterDifficulty">${[['','全部難度'],['1','入門'],['2','基礎'],['3','進階']].map(([v,t])=>opt(v,t,filters.difficulty)).join('')}</select></label><label>目前篩選<button data-action="reset-filters">重設篩選</button></label></div></section>`;}

function selectReview(list,count,priority=wrongIds()){const ordered=[...C.shuffle(list.filter(p=>priority.has(p.id))),...C.shuffle(list.filter(p=>!priority.has(p.id)))];return C.sample(ordered,count,()=>.999999);}

function render(){

function renderResults(){

function manageRow(p){const built=BASE.phrases.some(x=>x.id===p.id),patched=state.overrides.some(x=>x.id===p.id);return `<article class="manage-row"><div><span class="pill">${built?(patched?'內建 · 本機修改':'內建教材'):'自訂教材'} · ${kindLabel(p)} · ${esc(category(p))}</span><p class="jp" lang="ja">${esc(p.texts['ja-JP'])}</p><p>${esc(p.texts['zh-TW'])}</p><small>${esc(p.id)}</small></div><div class="row"><button data-action="edit" data-id="${esc(p.id)}">編輯</button>${!built?`<button class="danger" data-action="delete" data-id="${esc(p.id)}">刪除</button>`:''}</div></article>`;}

function renderLearn(){

function match(id,side){const g=game;if(!g||g.complete||g.done.includes(id))return;if(!selected||selected.side===side){selected=selected?.id===id&&selected.side===side?null:{id,side};renderGame();return;}const prev=selected;selected=null;if(prev.id===id){g.done.push(id);g.message='配對成功。再找下一組吧！';}else{g.mistakes++;g.wrong=[...new Set([...g.wrong,prev.id,id])];const p=g.items.find(x=>x.id===prev.id);g.message=`還沒配對成功。提示：先選的句子屬於「${category(p)}」，請留意動作和對象。`;}
 if(g.done.length===g.items.length){g.complete=true;const record={id:'record-'+Date.now()+'-'+Math.random().toString(36).slice(2,8),at:Date.now(),total:g.items.length,mistakes:g.mistakes,phraseIds:g.items.map(x=>x.id),wrongIds:g.wrong,direction:quizDirection};g.saved=update(s=>{const mastered=new Set(g.items.filter(p=>!g.wrong.includes(p.id)).map(p=>p.id));s.records=s.records.map(r=>({...r,wrongIds:r.wrongIds.filter(id=>!mastered.has(id))}));s.records=[record,...s.records].slice(0,100);});g.message='全部配對完成！';}
 renderGame();}

function refreshVoices(){getVoices();if($('#settingVoice'))$('#settingVoice').innerHTML=voiceOptions();if($('#voiceStatus'))$('#voiceStatus').textContent=voiceStatus();}
function stopSpeech(){speechToken++;if('speechSynthesis'in window)speechSynthesis.cancel();}
function speak(id,test=false){const p=data.phrases.find(p=>p.id===id),text=test?'こんにちは。日本語の音声をテストしています。':p?.texts['ja-JP'];if(!text)return;stopSpeech();getVoices();if(!('speechSynthesis'in window)||!voices.length){toast(voiceStatus());if($('#voiceStatus'))$('#voiceStatus').textContent=voiceStatus();return;}const selectedVoice=voices.find(v=>v.voiceURI===state.settings.voiceURI)||voices.find(v=>v.localService)||voices[0];const utterance=new SpeechSynthesisUtterance(text),token=speechToken;utterance.lang='ja-JP';utterance.voice=selectedVoice;utterance.rate=state.settings.rate;utterance.onstart=()=>{if(test&&$('#voiceStatus'))$('#voiceStatus').textContent='瀏覽器已開始播放。請確認是否聽到日文；離線能力仍需在斷網後實際測試。';};utterance.onerror=e=>{if(token===speechToken&&!['interrupted','canceled'].includes(e.error)){toast('發音失敗：'+e.error+'。請檢查系統語音或改選其他日文語音。');if($('#voiceStatus'))$('#voiceStatus').textContent='語音測試失敗：'+e.error;}};speechSynthesis.speak(utterance);if(p){lastPhrase=id;recent(id);}}
let cacheMessage='單檔版本：全部教材、樣式與程式已內嵌，不需要 Service Worker。';
async function setupPwa(){if(document.documentElement.dataset.build!=='pwa')return;if(!('serviceWorker'in navigator)||!['https:','http:'].includes(location.protocol)){cacheMessage='PWA 需透過 localhost 或 HTTPS 開啟；直接開檔請改用單檔版本。';updateCacheUI();return;}cacheMessage='正在準備離線快取…';updateCacheUI();try{const reg=await navigator.serviceWorker.register('./sw.js');const check=async()=>{const names=await caches.keys(),prefix='kemono-static-'+encodeURIComponent(new URL('./',location.href).pathname)+'-',name=names.filter(n=>n.startsWith(prefix)).sort().pop();if(!name)return;const cache=await caches.open(name),resources=['./','./index.html','./style.css','./core.js','./app.js','./data.js','./manifest.webmanifest','./icon-192.png','./icon-512.png','./icon-maskable.png'];const hits=await Promise.all(resources.map(r=>cache.match(new URL(r,location.href).href)));cacheMessage=hits.every(Boolean)?'必要資源已全部快取。可斷網重新開啟，驗證此裝置的離線使用。':'快取尚未完整，請保持頁面開啟，稍後重新載入。';updateCacheUI();};await navigator.serviceWorker.ready;await check();navigator.serviceWorker.addEventListener('message',e=>{if(e.data?.type==='CACHE_READY')check();});reg.addEventListener('updatefound',()=>{const worker=reg.installing;worker?.addEventListener('statechange',()=>{if(worker.state==='installed')check();});});}catch(e){cacheMessage='離線快取未完成：'+e.message+'。請使用單檔版，或在 HTTPS／localhost 重試。';updateCacheUI();}}
function updateCacheUI(){if($('#cacheStatus'))$('#cacheStatus').textContent=cacheMessage;$('#offlineStatus').textContent=document.documentElement.dataset.build==='pwa'?(cacheMessage.startsWith('必要')?'已備妥離線教材':'離線快取狀態見設定'):'全部教材已內建';}
document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;
 if(b.dataset.nav){stopSpeech();mode=b.dataset.nav;limit=20;render();window.scrollTo(0,0);return;}
 if(b.hasAttribute('data-kind')){filters.kind=b.dataset.kind;limit=20;render();return;}
 if(b.hasAttribute('data-scope')){filters.scope=b.dataset.scope;limit=20;if(mode==='learn')renderLearn();else render();return;}
 if(b.hasAttribute('data-grammar-group')){grammarGroup=b.dataset.grammarGroup;renderGrammar();return;}
 const id=b.dataset.id,a=b.dataset.action;if(!a)return;
 switch(a){
 case 'settings':settings();break;
 case 'close':b.closest('dialog')?.close();break;
 case 'favorite':if(update(s=>{s.favorites=s.favorites.includes(id)?s.favorites.filter(x=>x!==id):[...s.favorites,id];})){renderResults();const p=data.phrases.find(p=>p.id===id);document.querySelectorAll(`#detailDialog [data-action="favorite"]`).forEach(x=>x.outerHTML=favoriteButton(p));}break;
 case 'speak':speak(id);break;case 'stop':stopSpeech();toast('已停止播放。');break;
 case 'detail':showDetail(id);break;case 'display':showDisplay(id);break;case 'close-display':await closeDisplay();break;
 case 'fullscreen':try{if(document.fullscreenElement)await document.exitFullscreen();else if($('#displayDialog').requestFullscreen)await $('#displayDialog').requestFullscreen();else toast('此瀏覽器未提供全螢幕 API；目前已使用滿版展示。');fitDisplay();}catch(_){toast('此裝置無法進入系統全螢幕；目前已使用滿版展示。');}break;
 case 'load-more':limit+=20;renderResults();break;
 case 'reset-filters':filters={q:'',category:'',grammar:'',difficulty:'',scope:'all',kind:''};limit=20;render();break;
 case 'start-game':startGame();break;case 'match':match(id,b.dataset.side);break;
 case 'new-game':game=null;renderLearn();break;
 case 'end-game':if(game&&!game.complete&&game.done.length+game.mistakes>0){openDialog('#confirmDialog',`<div class="dialog-title"><h2>結束這回練習？</h2>${closeButton()}</div><p>已完成 ${game.done.length} 組。未完成的回合不會記錄；既有紀錄保留。</p><div class="form-foot"><button data-action="close">繼續練習</button><button data-action="confirm-end">結束這回</button></div>`);}else{game=null;renderLearn();}break;
 case 'confirm-end':$('#confirmDialog').close();game=null;renderLearn();break;
 case 'review-record':{const r=state.records.find(x=>x.id===id);if(!r?.wrongIds.length){toast('這回已沒有待複習的錯題。');break;}filters={q:'',category:'',grammar:'',difficulty:'',scope:'all',kind:''};reviewOnly=true;quizCount=4;startGame(r.wrongIds);break;}
 case 'practice-grammar':case 'browse-grammar':filters={q:'',category:'',grammar:id,difficulty:'',scope:'all',kind:''};reviewOnly=false;game=null;mode=a==='practice-grammar'?'learn':'phrases';limit=20;render();window.scrollTo(0,0);break;
 case 'add':editPhrase();break;case 'edit':editPhrase(id);break;case 'delete':deletePhrase(id);break;case 'confirm-delete':confirmDelete(id);break;
 case 'export-backup':exportBackup();break;case 'export-material':download('Kemono-教材-'+dateStamp()+'.json',{schemaVersion:1,languages:BASE.languages,readingCodes:BASE.readingCodes,phrases:data.phrases.filter(p=>p.hidden!==true),categories:data.categories,grammars:data.grammars});break;
 case 'import':$('#importFile').click();break;case 'confirm-import':confirmImport();break;case 'validate':validate();break;
 case 'test-voice':speak(null,true);break;case 'refresh-voices':refreshVoices();break;
 case 'recover':download('Kemono-舊資料復原-'+dateStamp()+'.json',recovery,true);recovery='';storageWarning='';toast('復原檔已送交下載；新的修改現在可存入本機。');settings();break;
 case 'install':if(installPrompt){await installPrompt.prompt();await installPrompt.userChoice;installPrompt=null;settings();}break;
 }
});
document.addEventListener('input',e=>{if(e.target.id==='search'){filters.q=e.target.value;limit=20;if(mode==='learn'){const list=pool(),available=availableCount(list);$('#quizAvailability').textContent=`${list.length} 筆符合篩選；排除相近語意後，最多可選 ${available} 組。`;const button=$('[data-action="start-game"]');if(button)button.disabled=available<quizCount;}else renderResults();}});
document.addEventListener('change',e=>{const t=e.target,v=t.value;
 const filterMap={filterCategory:'category',filterGrammar:'grammar',filterDifficulty:'difficulty'};
 if(filterMap[t.id]){filters[filterMap[t.id]]=v;limit=20;render();return;}
 if(t.id==='quizCount'){quizCount=Number(v);renderLearn();return;}if(t.id==='quizDirection'){quizDirection=v;return;}if(t.id==='reviewOnly'){reviewOnly=t.checked;renderLearn();return;}
 if(t.id==='displayHira'||t.id==='displayZh'){const hira=t.id==='displayHira';$('#displayDialog').querySelector(hira?'.hira':'.translation').classList.toggle('hidden',!t.checked);update(s=>s.settings[hira?'hira':'zh']=t.checked);fitDisplay();return;}
 const settingsMap={settingTheme:['theme',v],settingFont:['fontSize',Number(v)],settingHira:['hira',t.checked],settingZh:['zh',t.checked],settingEn:['en',t.checked],settingVoice:['voiceURI',v],settingRate:['rate',Number(v)]};
 if(settingsMap[t.id]){const [k,val]=settingsMap[t.id];if(update(s=>s.settings[k]=val)){applySettings();render();}}
 if(t.id==='importFile'){importFile(t.files[0]);t.value='';}
});
document.addEventListener('submit',e=>{if(e.target.id==='phraseForm'){e.preventDefault();submitPhrase(e.target);}});
$('#displayDialog').addEventListener('cancel',e=>{e.preventDefault();closeDisplay();});
$('#settingsDialog').addEventListener('close',()=>stopSpeech());
window.addEventListener('resize',fitDisplay);document.addEventListener('fullscreenchange',fitDisplay);
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e;});
window.addEventListener('storage',e=>{if(e.key===STORE)toast('另一個分頁已更新資料。請先備份本頁內容，再重新載入以讀取更新。');});
window.addEventListener('pagehide',stopSpeech);matchMedia('(prefers-color-scheme:dark)').addEventListener?.('change',applySettings);
if('speechSynthesis'in window)speechSynthesis.addEventListener('voiceschanged',refreshVoices);
render();getVoices();setupPwa();updateCacheUI();if(storageWarning)setTimeout(()=>toast(storageWarning),500);
})();
</script>
</body>
