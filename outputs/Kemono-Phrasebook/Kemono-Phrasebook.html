p":"請求與界限","pattern":"動詞て形 ＋ もいいですか","explanation":"詢問自己能否進行某個行為。拍照、擁抱、觸摸獸裝與公開照片都應分別取得同意。","conjugations":["撮る → 撮って → 撮ってもいいですか","座る → 座って","送る → 送って"],"words":["撮る／とる：拍攝","触る／さわる：觸摸","送る／おくる：寄送"],"exampleIds":["kp-011","kp-012","kp-017","kp-019"],"localizations":{"ja-JP":{"title":"許可を求める","group":"お願い・境界","pattern":"動詞て形 ＋ もいいですか","explanation":"自分がその行動をしてよいか尋ねます。撮影、ハグ、着ぐるみに触れること、写真の公開は、それぞれ別に同意を確認しましょう。","words":["撮る／とる：拍攝","触る／さわる：觸摸","送る／おくる：寄送"]}}},{"id":"g-polite","title":"請你幫個忙","group":"請求與界限","pattern":"動詞て形 ＋ もらえますか","explanation":"禮貌地請對方為自己做一件事；「すみませんが」可放在前面作為開場。","conjugations":["話す → 話して → 話してもらえますか","撮る → 撮って","変える → 変えて"],"words":["ゆっくり：慢慢地","もう少し／もうすこし：再稍微"],"exampleIds":["kp-008","kp-013","kp-016"],"localizations":{"ja-JP":{"title":"手伝ってもらう","group":"お願い・境界","pattern":"動詞て形 ＋ もらえますか","explanation":"相手に何かをしてもらうよう丁寧にお願いします。最初に「すみませんが」を添えることもできます。","words":["ゆっくり：慢慢地","もう少し／もうすこし：再稍微"]}}},{"id":"g-negative","title":"請不要這樣做","group":"請求與界限","pattern":"動詞ない形 ＋ でください","explanation":"清楚表達不希望對方做的動作。這裡使用「ないで」，不是「なくて」。","conjugations":["触る → 触らない","使う → 使わない","する → しない","来る → 来ない（こない）"],"words":["触る／さわる：觸摸","引っ張る／ひっぱる：拉扯"],"exampleIds":["kp-018","kp-067","kp-072","kp-073"],"localizations":{"ja-JP":{"title":"しないでほしいと伝える","group":"お願い・境界","pattern":"動詞ない形 ＋ でください","explanation":"してほしくない行動をはっきり伝えます。ここでは「なくて」ではなく「ないで」を使います。","words":["触る／さわる：觸摸","引っ張る／ひっぱる：拉扯"]}}},{"id":"g-want","title":"表達想做的事","group":"行動與時間","pattern":"動詞ます形去ます ＋ たいです","explanation":"表達自己的願望。通常不用來直接斷定他人的內心想法；邀約可使用「〜ませんか」。","conjugations":["飲みます → 飲みたいです","買います → 買いたいです","します → したいです"],"words":["水／みず：水","切符／きっぷ：車票"],"exampleIds":["kp-029","kp-037","kp-052","kp-077"],"localizations":{"ja-JP":{"title":"したいことを伝える","group":"動作・時間","pattern":"動詞ます形の「ます」を取る ＋ たいです","explanation":"自分の希望を伝えます。普通は、他人の気持ちを直接断定するためには使いません。誘うときには「〜ませんか」が使えます。","words":["水／みず：水","切符／きっぷ：車票"]}}},{"id":"g-invite","title":"邀請與提議","group":"行動與時間","pattern":"動詞ます形去ます ＋ ませんか／ましょう","explanation":"「ませんか」邀請對方一起做；「ましょう」提議一起做。「ましょうか」 function text(value,locale){const source=String(value??'');if(locale!=='ja-JP')return source;const s=source.trim();let result=ja[s];if(result===undefined){for(const [pattern,replace] of patterns)if(pattern.test(s)){result=s.replace(pattern,replace);break;}}

 return result===undefined?source:source.slice(0,source.indexOf(s))+result+source.slice(source.indexOf(s)+s.length);
}
const protectedSelector='[data-content],.jp,.hira,.translation,.game-card,textarea,script,style';
function localize(element,locale){
 const walker=document.createTreeWalker(element,NodeFilter.SHOW_TEXT);const nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);
 for(const node of nodes)if(!node.parentElement?.closest(protectedSelector))node.textContent=text(node.textContent,locale);
 for(const el of element.querySelectorAll('[aria-label],[placeholder],[title]'))for(const name of ['aria-label','placeholder','title'])if(el.hasAttribute(name))el.setAttribute(name,text(el.getAttribute(name),locale));
}
function html(markup,locale){if(locale!=='ja-JP')return markup;const template=document.createElement('template');template.innerHTML=markup;localize(template.content,locale);return template.innerHTML;}
const chrome=new Map();let mountedLanguage=null;

<script>

function fitDisplay(){requestAnimationFrame(()=>{
 const d=$('#displayDialog');if(!d.open)return;const primary=d.querySelector('.display-primary'),layout=d.querySelector('.display-layout'),secondary=[...d.querySelectorAll('.hira,.display-secondary')];
 for(const element of [primary,...secondary])element.style.fontSize='';
 const overflows=()=>layout.scrollHeight>d.clientHeight-parseFloat(getComputedStyle(d).paddingTop)*2;
 let n=parseFloat(getComputedStyle(primary).fontSize);
 const sizes=secondary.map(el=>parseFloat(getComputedStyle(el).fontSize));
 const fitSecondary=()=>secondary.forEach((el,i)=>el.style.fontSize=Math.max(14,Math.min(sizes[i],n*.65))+'px');
 fitSecondary();
 while(overflows()&&n>24){n=Math.max(24,n-2);primary.style.fontSize=n+'px';fitSecondary();}
 // Keep the main message prominent; shrink optional readings before allowing scrolling.
 while(overflows()){
  let changed=false;for(const el of secondary){const size=parseFloat(getComputedStyle(el).fontSize);if(size>14){el.style.fontSize=Math.max(14,size-1)+'px';changed=true;}}
  if(!changed)break;
 }
});}

function startGame(ids){const list=pool(),items=reviewOnly?selectReview(list,quizCount,ids?new Set(ids):wrongIds()):C.sample(list,quizCount);if(reviewOnly&&!list.some(p=>(ids?ids.includes(p.id):wrongIds().has(p.id)))){toast('範圍內沒有待複習錯題。請調整篩選。');return;}if(items.length<quizCount){toast(`範圍內只有 ${items.length} 組可區分的句子，請擴大篩選範圍或減少組數。`);return;}

function match(id,side){const g=game;if(!g||g.complete||g.done.includes(id))return;if(!selected||selected.side===side){selected=selected?.id===id&&selected.side===side?null:{id,side};renderGame();return;}const prev=selected;selected=null;if(prev.id===id){g.done.push(id);g.message='配對成功。再找下一組吧！';}else{g.mistakes++;g.wrong=[...new Set([...g.wrong,prev.id,id])];const p=g.items.find(x=>x.id===prev.id);g.message=`還沒配對成功。提示：先選的句子屬於「${category(p)}」，請留意動作和對象。`;}

 renderGame();}

async function importFile(file){if(!file)return;if(file.size>5*1024*1024){toast('檔案超過 5 MB，請分批匯入。');return;}try{const raw=JSON.parse(await file.text()),parsed=C.parseImport(raw,state,BASE);if(parsed.errors.length){pendingImport=null;openDialog('#importDialog',`<div class="dialog-title"><h2>資料驗證未通過</h2>${closeButton()}</div><p class="notice error">${esc(parsed.errors.join('\n'))}</p><p>未寫入任何資料。請修正 JSON 後重試。</p>`);return;}pendingImport=parsed;const count=parsed.bundle.phrases.length,collisions=parsed.bundle.phrases.filter(p=>data.phrases.some(x=>x.id===p.id)),built=collisions.filter(p=>BASE.phrases.some(x=>x.id===p.id));openDialog('#importDialog',`<div class="dialog-title"><h2>匯入預覽</h2>${closeButton()}</div><p>驗證通過：${parsed.kind==='backup'?'完整備份':'教材 JSON'}，${count} 句、${parsed.bundle.categories?.length||0} 個分類、${parsed.bundle.grammars?.length||0} 個文法。</p><p class="notice">${collisions.length} 個句子 ID 已存在，其中 ${built.length} 個為內建教材。<br>預設保留現有同 ID 內容，只加入新資料；勾選下方選項才會更新已存在內容${parsed.kind==='backup'?'與設定':''}。${parsed.kind==='backup'?'收藏與練習紀錄會合併。':''}</p>${collisions.length?`<details><summary>查看將保留或覆寫的句子</summary><div class="import-list">${collisions.map(p=>`<p data-content>${esc(p.id)} · ${esc(p.texts['zh-TW'])}</p>`).join('')}</div></details>`:''}${parsed.warnings.length?`<p class="notice">${esc(parsed.warnings.join('\n'))}</p>`:''}<label class="inline"><input id="replaceImport" type="checkbox">允許更新相同 ID 的教材${parsed.kind==='backup'?'及備份中的設定':''}</label><p class="small-text muted">建議先下載目前的完整備份。匯入會保留未包含在檔案中的既有資料。</p><div class="form-foot"><button data-action="export-backup">先下載備份</button><button class="primary" data-action="confirm-import">確認合併匯入</button></div>`);}catch(e){toast('JSON 無法讀取：請選擇有效的教材或備份檔案。');}}
function confirmImport(){if(!pendingImport)return;const next=C.mergeImport(state,pendingImport,BASE,$('#replaceImport').checked),merged=C.allData(BASE,next),v=C.validateBundle({...merged,schemaVersion:1},BASE);if(v.errors.length){toast('合併後驗證失敗：'+v.errors[0]);return;}if(commit(next)){$('#importDialog').close();pendingImport=null;applySettings();render();toast('匯入完成，資料已儲存於本機。');}}
function validate(){const v=C.validateBundle(data,BASE),dups=C.duplicates(data.phrases);openDialog('#confirmDialog',`<div class="dialog-title"><h2>教材檢查結果</h2>${closeButton()}</div><p>${data.phrases.filter(p=>p.hidden!==true).length} 筆 · ${data.categories.length} 個情境 · ${data.grammars.length} 個文法</p><p class="notice ${v.errors.length?'error':''}">${v.errors.length?esc(v.errors.join('\n')):'資料結構、讀音、分類與參照 ID 全部通過驗證。'}</p><p class="notice">${dups.length?esc(dups.map(p=>'重複日文原句：'+p.join(' / ')).join('\n')):'沒有重複的日文原句。'}</p><p class="small-text muted">檢查無法自動判定翻譯或文法的語言正確性。</p>`);}
function getVoices(){voices=('speechSynthesis'in window?speechSynthesis.getVoices():[]).filter(v=>/^ja(?:[-_]|$)/i.test(v.lang)).sort((a,b)=>Number(b.localService)-Number(a.localService));return voices;}
function voiceOptions(){return opt('','自動選擇（優先本機）',state.settings.voiceURI)+voices.map(v=>opt(v.voiceURI,v.name+(v.localService?' · 本機':' · 可能需要網路'),state.settings.voiceURI)).join('');}
function voiceStatus(){if(!('speechSynthesis'in window))return '這個瀏覽器未提供 Web Speech API，無法朗讀。';if(!voices.length)return '尚未找到可用的日文語音。請在系統設定安裝日文語音後重新載入，或稍後重新偵測。';return `找到 ${voices.length} 個日文語音，其中 ${voices.filter(v=>v.localService).length} 個標記為本機。請開啟飛航模式後實際測試；本機標記不代表已驗證可離線朗讀。`;}
function settings(){getVoices();const s=state.settings;openDialog('#settingsDialog',`<div class="dialog-title"><h2>讓手帖更順手</h2>${closeButton()}</div><div class="stack"><label>介面語言<select id="settingLanguage">${opt('zh-TW','繁體中文',s.uiLanguage,true)}${opt('ja-JP','日本語',s.uiLanguage,true)}</select></label><h3>閱讀顯示</h3><div class="form-grid"><label>外觀<select id="settingTheme">${[['light','淺色'],['dark','深色'],['system','跟隨系統']].map(([v,t])=>opt(v,t,s.theme)).join('')}</select></label><label>文字大小<select id="settingFont">${[[.9,'較小'],[1,'標準'],[1.15,'較大'],[1.3,'特大']].map(([v,t])=>opt(v,t,s.fontSize)).join('')}</select></label></div><div class="row"><label class="inline"><input id="settingHira" type="checkbox" ${s.hira?'checked':''}>顯示平假名</label><label class="inline"><input id="settingZh" type="checkbox" ${s.zh?'checked':''}>顯示中文</label><label class="inline"><input id="settingEn" type="checkbox" ${s.en?'checked':''}>顯示英文（若有）</label></div><hr><h3>日文發音</h3><label>日文語音<select id="settingVoice">${voiceOptions()}</select></label><label>播放速度<select id="settingRate">${[.75,1,1.25].map(n=>opt(n,n.toFixed(2).replace(/0$/,'')+'x',s.rate)).join('')}</select></label><p id="voiceStatus" class="notice" role="status">${esc(voiceStatus())}</p><div class="row"><button class="primary" data-action="test-voice">測試日文語音</button><button data-action="refresh-voices">重新偵測</button><button data-action="stop">停止播放</button></div><p class="small-text muted">預設朗讀日文原句，語言指定 ja-JP。語音能否離線播放取決於系統、已下載語音及瀏覽器；教材、搜尋與練習不需要語音也能離線使用。</p><hr><h3>離線與備份</h3><p id="cacheStatus" class="notice">${esc(cacheMessage)}</p><div class="row"><button data-action="export-backup">下載完整備份</button><button data-action="import">匯入 JSON</button>${installPrompt?'<button data-action="install" class="primary">安裝到桌面</button>':''}</div><p class="small-text muted">手機安裝請使用 PWA 的 HTTPS 網址（iPhone 可由 Safari 分享選單加入主畫面）。單檔 HTML 可直接開啟。不同瀏覽器或網站來源的本機儲存互相獨立；同一網站來源的不同路徑可能共用資料。單檔儲存依瀏覽器而異，搬移前請先備份。私密瀏覽或清除網站資料會移除儲存內容。</p>${recovery?'<p class="notice error">舊儲存資料無法讀取。請先下載復原檔；下載後才可開始寫入新的本機資料。</p><button data-action="recover">下載舊資料復原檔並啟用儲存</button>':''}</div>`);}
function refreshVoices(){getVoices();if($('#settingVoice'))$('#settingVoice').innerHTML=uiHTML(voiceOptions());if($('#voiceStatus'))$('#voiceStatus').textContent=t(voiceStatus());}
function stopSpeech(){speechToken++;if('speechSynthesis'in window)speechSynthesis.cancel();}
function speak(id,test=false){const p=data.phrases.find(p=>p.id===id),text=test?'こんにちは。日本語の音声をテストしています。':p?.texts['ja-JP'];if(!text)return;stopSpeech();getVoices();if(!('speechSynthesis'in window)||!voices.length){toast(voiceStatus());if($('#voiceStatus'))$('#voiceStatus').textContent=t(voiceStatus());return;}const selectedVoice=voices.find(v=>v.voiceURI===state.settings.voiceURI)||voices.find(v=>v.localService)||voices[0];const utterance=new SpeechSynthesisUtterance(text),token=speechToken;utterance.lang='ja-JP';utterance.voice=selectedVoice;utterance.rate=state.settings.rate;utterance.onstart=()=>{if(test&&$('#voiceStatus'))$('#voiceStatus').textContent=t('瀏覽器已開始播放。請確認是否聽到日文；離線能力仍需在斷網後實際測試。');};utterance.onerror=e=>{if(token===speechToken&&!['interrupted','canceled'].includes(e.error)){toast('發音失敗：'+e.error+'。請檢查系統語音或改選其他日文語音。');if($('#voiceStatus'))$('#voiceStatus').textContent=t('語音測試失敗：'+e.error);}};speechSynthesis.speak(utterance);if(p){lastPhrase=id;recent(id);}}
let cacheMessage='單檔版本：全部教材、樣式與程式已內嵌，不需要 Service Worker。';
async function setupPwa(){if(document.documentElement.dataset.build!=='pwa')return;if(!('serviceWorker'in navigator)||!['https:','http:'].includes(location.protocol)){cacheMessage='PWA 需透過 localhost 或 HTTPS 開啟；直接開檔請改用單檔版本。';updateCacheUI();return;}cacheMessage='正在準備離線快取…';updateCacheUI();try{const reg=await navigator.serviceWorker.register('./sw.js');const check=async()=>{const names=await caches.keys(),prefix='kemono-static-'+encodeURIComponent(new URL('./',location.href).pathname)+'-',name=names.filter(n=>n.startsWith(prefix)).sort().pop();if(!name)return;const cache=await caches.open(name),resources=['./','./index.html','./style.css','./core.js','./i18n.js','./app.js','./data.js','./manifest.webmanifest','./icon-192.png','./icon-512.png','./icon-maskable.png'];const hits=await Promise.all(resources.map(r=>cache.match(new URL(r,location.href).href)));cacheMessage=hits.every(Boolean)?'必要資源已全部快取。可斷網重新開啟，驗證此裝置的離線使用。':'快取尚未完整，請保持頁面開啟，稍後重新載入。';updateCacheUI();};await navigator.serviceWorker.ready;await check();navigator.serviceWorker.addEventListener('message',e=>{if(e.data?.type==='CACHE_READY')check();});reg.addEventListener('updatefound',()=>{const worker=reg.installing;worker?.addEventListener('statechange',()=>{if(worker.state==='installed')check();});});}catch(e){cacheMessage='離線快取未完成：'+e.message+'。請使用單檔版，或在 HTTPS／localhost 重試。';updateCacheUI();}}
function updateCacheUI(){if($('#cacheStatus'))$('#cacheStatus').textContent=t(cacheMessage);$('#offlineStatus').textContent=t(document.documentElement.dataset.build==='pwa'?(cacheMessage.startsWith('必要')?'已備妥離線教材':'離線快取狀態見設定'):'全部教材已內建');}
document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;
 if(b.dataset.nav){stopSpeech();mode=b.dataset.nav;limit=20;render();window.scrollTo(0,0);return;}
 if(b.hasAttribute('data-kind')){filters.kind=b.dataset.kind;limit=20;render();return;}
 if(b.hasAttribute('data-scope')){filters.scope=b.dataset.scope;limit=20;if(mode==='learn')renderLearn();else render();return;}
 if(b.hasAttribute('data-grammar-group')){grammarGroup=b.dataset.grammarGroup;renderGrammar();return;}
 const id=b.dataset.id,a=b.dataset.action;if(!a)return;
 switch(a){
 case 'settings':settings();break;
 case 'language':setLanguage(state.settings.uiLanguage==='ja-JP'?'zh-TW':'ja-JP');break;
 case 'close':b.closest('dialog')?.close();break;
 case 'favorite':if(update(s=>{s.favorites=s.favorites.includes(id)?s.favorites.filter(x=>x!==id):[...s.favorites,id];})){renderResults();const p=data.phrases.find(p=>p.id===id);document.querySelectorAll(`#detailDialog [data-action="favorite"]`).forEach(x=>x.outerHTML=uiHTML(favoriteButton(p)));}break;
 case 'speak':speak(id);break;case 'stop':stopSpeech();toast('已停止播放。');break;
 case 'detail':showDetail(id);break;case 'display':showDisplay(id);break;case 'close-display':await closeDisplay();break;
 case 'fullscreen':try{if(document.fullscreenElement)await document.exitFullscreen();else if($('#displayDialog').requestFullscreen)await $('#displayDialog').requestFullscreen();else toast('此瀏覽器未提供全螢幕 API；目前已使用滿版展示。');fitDisplay();}catch(_){toast('此裝置無法進入系統全螢幕；目前已使用滿版展示。');}break;
 case 'load-more':limit+=20;renderResults();break;
 case 'reset-filters':filters={q:'',category:'',grammar:'',difficulty:'',scope:'all',kind:''};limit=20;render();break;
 case 'start-game':startGame();break;case 'match':match(id,b.dataset.side);break;
 case 'new-game':game=null;renderLearn();break;
 case 'end-game':if(game&&!game.complete&&game.done.length+game.mistakes>0){openDialog('#confirmDialog',`<div class="dialog-title"><h2>結束這回練習？</h2>${closeButton()}</div><p>已完成 ${game.done.length} 組。未完成的回合不會記錄；既有紀錄保留。</p><div class="form-foot"><button data-action="close">繼續練習</button><button data-action="confirm-end">結束這回</button></div>`);}else{game=null;renderLearn();}break;
 case 'confirm-end':$('#confirmDialog').close();game=null;renderLearn();break;
 case 'review-record':{const r=state.records.find(x=>x.id===id);if(!r?.wrongIds.length){toast('這回已沒有待複習的錯題。');break;}filters={q:'',category:'',grammar:'',difficulty:'',scope:'all',kind:''};reviewOnly=true;quizCount=4;startGame(r.wrongIds);break;}
 case 'practice-grammar':case 'browse-grammar':filters={q:'',category:'',grammar:id,difficulty:'',scope:'all',kind:''};reviewOnly=false;game=null;mode=a==='practice-grammar'?'learn':'phrases';limit=20;render();window.scrollTo(0,0);break;
 case 'add':editPhrase();break;case 'edit':editPhrase(id);break;case 'delete':deletePhrase(id);break;case 'confirm-delete':confirmDelete(id);break;
 case 'export-backup':exportBackup();break;case 'export-material':download('Kemono-教材-'+dateStamp()+'.json',{schemaVersion:1,languages:BASE.languages,readingCodes:BASE.readingCodes,phrases:C.search(data,{},state),categories:data.categories,grammars:data.grammars});break;
 case 'import':$('#importFile').click();break;case 'confirm-import':confirmImport();break;case 'validate':validate();break;
 case 'test-voice':speak(null,true);break;case 'refresh-voices':refreshVoices();break;
 case 'recover':download('Kemono-舊資料復原-'+dateStamp()+'.json',recovery,true);recovery='';storageWarning='';toast('復原檔已送交下載；新的修改現在可存入本機。');settings();break;
 case 'install':if(installPrompt){await installPrompt.prompt();await installPrompt.userChoice;installPrompt=null;settings();}break;
 }
});
document.addEventListener('input',e=>{if(e.target.id==='search'){filters.q=e.target.value;limit=20;if(mode==='learn'){const list=pool(),available=availableCount(list);$('#quizAvailability').textContent=t(`${list.length} 筆符合篩選；排除相近語意後，最多可選 ${available} 組。`);const button=$('[data-action="start-game"]');if(button)button.disabled=available<quizCount;}else renderResults();}});
document.addEventListener('change',e=>{const t=e.target,v=t.value;
 const filterMap={filterCategory:'category',filterGrammar:'grammar',filterDifficulty:'difficulty'};
 if(filterMap[t.id]){filters[filterMap[t.id]]=v;limit=20;render();return;}
 if(t.id==='settingLanguage'){setLanguage(v);settings();return;}
 if(t.id==='quizCount'){quizCount=Number(v);renderLearn();return;}if(t.id==='quizDirection'){quizDirection=v;return;}if(t.id==='reviewOnly'){reviewOnly=t.checked;renderLearn();return;}
 if(t.id==='displayHira'||t.id==='displayZh'){const hira=t.id==='displayHira';$('#displayDialog').querySelector(hira?'.hira':'.display-secondary').classList.toggle('hidden',!t.checked);update(s=>s.settings[hira?'hira':s.settings.uiLanguage==='ja-JP'?'displayJapanese':'zh']=t.checked);fitDisplay();return;}
 const settingsMap={settingTheme:['theme',v],settingFont:['fontSize',Number(v)],settingHira:['hira',t.checked],settingZh:['zh',t.checked],settingEn:['en',t.checked],settingVoice:['voiceURI',v],settingRate:['rate',Number(v)]};
 if(settingsMap[t.id]){const [k,val]=settingsMap[t.id];if(update(s=>s.settings[k]=val)){applySettings();render();}}
 if(t.id==='importFile'){importFile(t.files[0]);t.value='';}
});
document.addEventListener('submit',e=>{if(e.target.id==='phraseForm'){e.preventDefault();submitPhrase(e.target);}});
$('#displayDialog').addEventListener('cancel',e=>{e.preventDefault();closeDisplay();});
$('#settingsDialog').addEventListener('close',()=>stopSpeech());
window.addEventListener('resize',fitDisplay);document.addEventListener('fullscreenchange',fitDisplay);
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e;});
window.addEventListener('storage',e=>{if(e.key===STORE)toast('另一個分頁已更新資料。請先備份本頁內容，再重新載入以讀取更新。');});
window.addEventListener('pagehide',stopSpeech);matchMedia('(prefers-color-scheme:dark)').addEventListener?.('change',applySettings);
if('speechSynthesis'in window)speechSynthesis.addEventListener('voiceschanged',refreshVoices);
render();getVoices();setupPwa();updateCacheUI();if(storageWarning)setTimeout(()=>toast(storageWarning),500);
})();
</script>
</body>
