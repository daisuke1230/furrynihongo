name: Deploy Kemono Phrasebook to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Set up Node.js for data checks
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Validate curriculum and core behavior
        run: node scripts/test-core.cjs
      - name: Build standalone and PWA
        run: python3 scripts/build.py
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6.0.0
      - name: Upload PWA only
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: outputs/Kemono-Phrasebook/pwa

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
